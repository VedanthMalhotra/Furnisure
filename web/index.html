<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#182e26">
<title>Furnisure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23496650'/%3E%3Cpath d='M16 7 8 11.5v9L16 25l8-4.5v-9z M8 11.5 16 16l8-4.5 M16 16v9' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./ui.css">
<style>
html, body { overflow: hidden }
.screen { position: absolute; inset: 0; display: none }
.screen.on { display: block }
.page { height: 100%; overflow: auto; -webkit-overflow-scrolling: touch }
.wrap { display: flex; flex-direction: column; min-height: 100%; max-width: 1200px; margin: 0 auto;
  padding: calc(var(--top) + 22px) clamp(18px, 5vw, 48px) calc(var(--bottom) + 28px) }

/* Scan screen */
#scan { background-color: #182e26;
  background-image: radial-gradient(ellipse at 50% 30%, #3f5f4e 0%, transparent 70%),
    radial-gradient(circle, #7b9380 1px, transparent 1px);
  background-size: auto, 24px 24px }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px }
.brand { display: flex; align-items: center; gap: 11px; color: #fbfcf7; font-weight: 700; font-size: 21px; letter-spacing: -.035em }
.mark { width: 38px; height: 38px; border-radius: 12px; background: #e1eccf; color: #263e31; display: grid; place-items: center }
.mark svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
.topbar .status-pill { background: #253e33; border-color: #537161; color: #f0f5eb }
.upload { width: min(100%, 510px); margin: auto; padding: clamp(14px, 4vw, 24px);
  border: 1px solid #fff8; border-radius: 27px; background: #fbfcf7; box-shadow: 0 24px 64px #0d211b66 }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center;
  min-height: clamp(174px, 38vw, 224px); padding: 22px; border: 1px dashed #8ba791; border-radius: 17px;
  background: radial-gradient(ellipse at 50% 0%, #f7faf1, #e9f0e4); color: #283f32;
  cursor: pointer; transition: border-color .15s, background-color .15s }
.drop:hover, .drop.over { border-color: #496650; background: #dde9db }
.drop.has { min-height: 108px; flex-direction: row; gap: 14px; border-style: solid; background: var(--accent-soft) }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0 }
.drop .ic { display: grid; place-items: center; flex: none; width: 62px; height: 62px; border-radius: 20px; color: #f0f6e9;
  background: #314e3e; box-shadow: 0 0 0 7px #dbe7d8, 0 8px 17px #20372930 }
.drop .ic svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round }
.drop.has .ic { width: 42px; height: 42px; border-radius: 12px; box-shadow: none }
.drop.has .ic svg { width: 22px; height: 22px }
.drop strong { font-size: clamp(22px, 6vw, 30px); line-height: 1.12; letter-spacing: -.045em; overflow-wrap: anywhere }
.drop.has strong { font-size: 16px; letter-spacing: normal }
.upload-hint { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0 0 }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
.upload .btn { min-height: 48px; margin-top: 10px }
.err { color: var(--bad); white-space: pre-wrap; font-size: 13px }
.err:not(:empty) { margin-top: 10px; background: var(--bad-soft); padding: 8px 10px; border-radius: 8px }

/* Progress screen */
.progress-wrap { max-width: 560px; margin: 0 auto; padding: calc(var(--top) + 48px) 16px 40px }
.progress-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: var(--shadow) }
.progress-card h1 { font-size: 21px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px }
.progress-card > p { margin: 0 0 16px; color: var(--muted) }
.spin { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; flex: none }
@keyframes s { to { transform: rotate(360deg) } }
.bar-track { height: 4px; border-radius: 4px; background: var(--sunken); overflow: hidden; margin-bottom: 16px }
.bar-track i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 4px; animation: slide 1.6s ease-in-out infinite }
@keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(290%) } }
.log { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 46vh; overflow: auto; white-space: pre-wrap }
.log:empty::before { content: "Uploading…" }
.progress-card .btn { margin-top: 16px }

/* Player */
#c { display: block; width: 100vw; height: 100vh; touch-action: none }
.k { font-size: 12px; color: var(--muted) }
.mate { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-word; margin-top: 4px }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
.badges:empty { display: none }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap }
.stated { background: var(--ok-soft); color: var(--ok) } .derived { background: #e6f1fb; color: #0c447c }
.estimated { background: #faeeda; color: #854f0b } .user { background: #eeedfe; color: #3c3489 } .warn { background: var(--bad-soft); color: var(--bad) }
.player-card details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 4px }
.part { margin: 6px 0; font-size: 13px }
.part b { font-weight: 600 }
.dims { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px }
.issue { font-size: 12px; color: var(--bad); margin: 4px 0 }
.dots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border) }
.dot.on { background: var(--accent) }

@media (max-width: 760px) {
  .upload { margin-top: clamp(30px, 8vh, 72px) }
  .dots { display: none }
}
</style>
</head>
<body>

<section class="screen on" id="scan">
  <div class="page"><div class="wrap">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></span>Furnisure</div>
      <span class="status-pill" id="health">Connecting…</span>
    </header>

    <main class="upload">
      <label class="drop" id="drop">
        <input type="file" id="files" accept="application/pdf,image/*" aria-describedby="fileHint" multiple>
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
        <strong id="fileLabel">Upload manual</strong>
      </label>
      <p class="upload-hint" id="fileHint">PDF or photos in page order</p>
      <button class="btn block" id="go" hidden disabled>Read manual</button>
      <div class="err" id="scanErr" role="alert"></div>
    </main>

  </div></div>
</section>

<section class="screen" id="progress">
  <div class="page"><div class="progress-wrap">
    <div class="progress-card">
      <h1><span class="spin" id="spin"></span><span id="progTitle">Reading the manual…</span></h1>
      <p>The pages are sorted, the parts list is read, then every step page. This usually takes one to three minutes.</p>
      <div class="bar-track" id="progBar"><i></i></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="err" id="progErr" role="alert"></div>
      <button class="btn secondary block" id="back1">Back</button>
    </div>
  </div></div>
</section>

<section class="screen" id="player">
  <canvas id="c"></canvas>
  <div class="player-card glass">
    <div class="eyebrow" id="stepNo">Building geometry…</div>
    <div class="step-title" id="title"></div>
    <div id="stepIssues"></div>
    <details><summary>Mate and confidence</summary><div class="mate" id="mate"></div><div class="badges" id="badges"></div></details>
    <details id="partsBox"><summary id="partsSummary">Parts</summary><div id="parts"></div></details>
    <details id="issuesBox"><summary id="issuesSummary">Checks</summary><div id="issues"></div></details>
    <div class="k" id="status" style="margin-top:6px"></div>
  </div>
  <div class="dock">
    <div class="page-thumb glass" id="src" style="display:none"><canvas id="srcCanvas"></canvas><div class="muted" id="srcLabel"></div></div>
    <div class="controls glass">
      <div class="group">
        <a class="icon-btn home-btn" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
        <span class="sep"></span>
        <button class="icon-btn" id="prev" aria-label="Previous step" title="Previous step"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="pill-btn" id="play">Pause</button>
        <button class="icon-btn" id="next" aria-label="Next step" title="Next step"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="icon-btn" id="replay" aria-label="Replay step" title="Replay step"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
      <div class="grow">
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub within step">
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
      <div class="group">
        <label class="chip"><input type="checkbox" id="all" checked>Autoplay</label>
        <label class="chip"><input type="checkbox" id="lineart">Line art</label>
        <label class="chip"><input type="checkbox" id="showsrc">Page</label>
      </div>
    </div>
  </div>
</section>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="./main.js"></script>
<script type="module" src="./home.js"></script>
</body>
</html>
